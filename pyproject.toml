[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ChatBrowser"
dynamic = ["version"]
description = "ChatBrowser: ChatArch browser runtime and artifact identity package"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "click>=8.0",
    "chatup>=0.2.1,<0.3.0",
    "chatstyle>=0.2.0,<0.3.0",
    "chatenv>=0.2.10,<0.3.0",
]
authors = [{name = "ChatArch", email = "1073853456@qq.com"}]
keywords = ["chatbrowser", "chatarch", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/ChatArch/ChatBrowser"
Repository = "https://github.com/ChatArch/ChatBrowser"
Documentation = "https://arch.gh.wzhecnu.cn/ChatBrowser/"

[project.scripts]
chatbrowser = "chatbrowser.cli:main"

[project.entry-points."chatenv.configs"]
chatbrowser = "chatbrowser.config"

[project.optional-dependencies]
dev = ["build", "pytest", "twine"]
docs = ["mkdocs>=1.6,<2.0", "mkdocs-material>=9.5,<10.0", "mkdocs-static-i18n>=1.2,<2.0", "mike>=2.0,<3.0"]

[tool.setuptools.dynamic]
version = {attr = "chatbrowser.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = true
